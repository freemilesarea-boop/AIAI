[project]
name = "luber-generation-client"
version = "0.1.0"
description = "Provider-agnostic music generation boundary (MusicGenerationProvider)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "luber-schemas",
]

[tool.uv.sources]
luber-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_generation_client"]
