[project]
name = "luber-generation-client"
version = "0.1.0"
description = "Provider-agnostic music generation boundary (MusicGenerationProvider)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "luber-schemas",
    "luber-database",
    "luber-audio-utils",
]

[tool.uv.sources]
luber-schemas = { workspace = true }
luber-database = { workspace = true }
luber-audio-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_generation_client"]
