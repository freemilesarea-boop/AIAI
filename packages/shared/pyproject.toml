[project]
name = "luber-shared"
version = "0.1.0"
description = "Shared cross-service utilities: structured logging, base settings"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_shared"]
