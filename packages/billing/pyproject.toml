[project]
name = "luber-billing"
version = "0.1.0"
description = "PayApp recurring billing: provider client, notification validation, subscription state machine, reconciliation"
requires-python = ">=3.11"
# Deliberately thin, for the same reason `luber-provider-resilience` is.
# This package decides what a payment notification *means* and what a
# subscription may do next. It never opens a database session: the
# repository is passed in, and the reconciliation service takes its
# input as plain records. That keeps the money logic testable without a
# database and stops the seam from running both ways.
dependencies = ["luber-schemas", "luber-shared", "httpx>=0.28"]

[tool.uv.sources]
luber-schemas = { workspace = true }
luber-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_billing"]
