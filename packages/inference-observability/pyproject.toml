[project]
name = "luber-inference-observability"
version = "0.1.0"
description = "Trend analysis, regression detection and incidents over Phase 29 inference traces"
requires-python = ">=3.11"
# Deliberately thin. This package reads Phase 29 traces and counts
# things; it does not decode audio, call a provider or touch a model, so
# it takes neither numpy nor the QC engine's analysis stack. It depends
# on luber-inference-qc only for the finding and outcome vocabulary —
# duplicating those strings is how two components come to disagree about
# what EARLY_COLLAPSE is called.
dependencies = ["luber-inference-qc", "luber-schemas", "luber-shared"]

[tool.uv.sources]
luber-inference-qc = { workspace = true }
luber-schemas = { workspace = true }
luber-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_inference_observability"]
