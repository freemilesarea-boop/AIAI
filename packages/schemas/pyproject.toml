[project]
name = "luber-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas and domain enums for LUBER MUSIC AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_schemas"]
