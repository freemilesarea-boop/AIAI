[project]
name = "luber-audio-utils"
version = "0.1.0"
description = "Audio delivery format contract, ffmpeg post-processing, and object storage"
requires-python = ">=3.11"
# ffmpeg/ffprobe are external binaries, not Python packages.
dependencies = ["boto3>=1.35", "luber-schemas"]

[tool.uv.sources]
luber-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_audio_utils"]
