[project]
name = "luber-evaluation"
version = "0.1.0"
description = "Model evaluation, checkpoint qualification, and promotion review"
requires-python = ">=3.11"
# Reuses the finishing engine's analysis and the training registry.
# No GPU, no provider SDK: this decides whether a checkpoint is better,
# and the generation backend produces the audio it judges.
dependencies = ["luber-training", "luber-audio-finishing"]

[tool.uv.sources]
luber-training = { workspace = true }
luber-audio-finishing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_evaluation"]
