[project]
name = "luber-training"
version = "0.1.0"
description = "Training orchestration, experiment registry, and checkpoint lifecycle"
requires-python = ">=3.11"
# No GPU, ML or provider SDK dependencies. This package decides *what*
# to train and never performs training itself; the execution backend
# owns everything vendor-specific.
dependencies = ["luber-dataset", "luber-hardware"]

[tool.uv.sources]
luber-dataset = { workspace = true }
luber-hardware = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_training"]
