[project]
name = "luber-audio-finishing"
version = "0.1.0"
description = "Objective audio analysis and adaptive finishing for LUBER-generated masters"
requires-python = ">=3.11"
# ffmpeg/ffprobe are external binaries, not Python packages. numpy is the
# only runtime dependency: no ML models, no GPU, no plugin hosts.
dependencies = ["numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_audio_finishing"]
