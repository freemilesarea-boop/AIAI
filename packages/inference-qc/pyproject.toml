[project]
name = "luber-inference-qc"
version = "0.1.0"
description = "Technical quality control, adaptive retry and candidate selection for generation"
requires-python = ">=3.11"
# Measurement comes from the finishing engine's analyser and the dataset
# factory's tempo/key estimators. Neither is re-implemented here: two
# versions of "what is the BPM of this file" would eventually disagree,
# and the one that mattered would be whichever the caller happened to
# import. No GPU, no provider SDK — this package judges audio and never
# produces it.
dependencies = ["numpy>=2.1", "luber-audio-finishing", "luber-dataset", "luber-schemas"]

[tool.uv.sources]
luber-audio-finishing = { workspace = true }
luber-dataset = { workspace = true }
luber-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_inference_qc"]
