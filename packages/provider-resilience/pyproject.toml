[project]
name = "luber-provider-resilience"
version = "0.1.0"
description = "Provider circuit breaking, routing, safe failover and degraded mode"
requires-python = ">=3.11"
# Thin on purpose. This package decides *which provider* a request goes
# to and whether it may go there at all; it never calls one, decodes
# audio or touches a model. It takes the schemas for the platform error
# vocabulary and nothing else — depending on the generation client would
# invert the direction the seam is meant to run in.
dependencies = ["luber-schemas", "luber-shared"]

# `luber-database` is deliberately NOT a dependency. `durable.py` takes a
# repository structurally and imports its exception type inside the one
# function that needs it, so this package still ships without SQLAlchemy
# and the seam points one way only.

[tool.uv.sources]
luber-schemas = { workspace = true }
luber-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_provider_resilience"]
