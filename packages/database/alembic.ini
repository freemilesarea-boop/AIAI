[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
# DATABASE_URL env var overrides this at runtime (see alembic/env.py)
sqlalchemy.url = postgresql+asyncpg://luber:luber_dev_password@localhost:5432/luber
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
