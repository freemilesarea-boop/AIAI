[project]
name = "luber-database"
version = "0.1.0"
description = "SQLAlchemy models, async engine factory, and Alembic migrations"
requires-python = ">=3.11"
dependencies = [
    # Imported at module level — the billing repository resolves plans from the schema table.
    "luber-schemas",
    # Phase 7: the subscription state machine and PayApp notification
    # vocabulary. This package stores billing rows; `luber-billing`
    # decides what they mean. The seam runs one way — `luber-billing`
    # never imports SQLAlchemy.
    "luber-billing",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[tool.uv.sources]
luber-schemas = { workspace = true }
luber-billing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_database"]
