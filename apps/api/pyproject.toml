[project]
name = "luber-api"
version = "0.1.0"
description = "LUBER MUSIC AI — public FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # Required by FastAPI to parse multipart uploads (reference audio).
    "python-multipart>=0.0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "redis>=5.2",
    # Argon2id password hashing. The reference implementation, actively
    # maintained, and it manages its own salts and parameter encoding —
    # nothing here rolls its own crypto.
    "argon2-cffi>=23.1",
    # Pydantic's EmailStr needs this; without it the import fails at
    # startup rather than at validation time.
    "email-validator>=2.2",
    "arq>=0.26",
    "luber-shared",
    "luber-schemas",
    "luber-database",
    "luber-generation-client",
    "luber-audio-utils",
    # The inference observability read model behind /v1/ops/inference.
    "luber-inference-observability",
    # The operator training console reads the Phase 25 and Phase 26
    # registries in-process. Both are pure Python with no GPU, ML or
    # provider dependencies — that is a deliberate property of those
    # packages, and it is what makes them safe to import into the API.
    "luber-billing",
    "luber-training",
    "luber-evaluation",
]

[tool.uv.sources]
luber-shared = { workspace = true }
luber-billing = { workspace = true }
luber-schemas = { workspace = true }
luber-database = { workspace = true }
luber-generation-client = { workspace = true }
luber-audio-utils = { workspace = true }
luber-inference-observability = { workspace = true }
luber-training = { workspace = true }
luber-evaluation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_api"]
