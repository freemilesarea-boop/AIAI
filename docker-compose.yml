name: luber-music-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luber_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-luber}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luber} -d ${POSTGRES_DB:-luber}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-luber}:${POSTGRES_PASSWORD:-luber_dev_password}@postgres:5432/${POSTGRES_DB:-luber}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  generation-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
      args:
        WORKER_PACKAGE: luber-generation-worker
    command: ["arq", "luber_generation_worker.worker.WorkerSettings"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-luber}:${POSTGRES_PASSWORD:-luber_dev_password}@postgres:5432/${POSTGRES_DB:-luber}
    depends_on:
      redis:
        condition: service_healthy

  audio-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
      args:
        WORKER_PACKAGE: luber-audio-worker
    command: ["arq", "luber_audio_worker.worker.WorkerSettings"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
