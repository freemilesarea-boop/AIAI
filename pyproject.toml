[project]
name = "luber-music-ai"
version = "0.1.0"
description = "LUBER MUSIC AI monorepo — Python workspace root"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "services/generation-worker",
    "services/audio-worker",
    "packages/database",
    "packages/schemas",
    "packages/shared",
    "packages/generation-client",
    "packages/audio-utils",
    "packages/dataset",
    "packages/audio-finishing",
    "packages/training",
    "packages/evaluation",
    "packages/inference-qc",
    "packages/inference-observability",
    "packages/provider-resilience",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "fakeredis>=2.26",
    "aiosqlite>=0.20",
    "numpy>=2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep a temp directory only when its test failed. The suite moves real
# audio through a real pipeline — masters, finished masters, previews —
# and since Phase 29 made the mock provider honour the requested
# duration those files are minutes long rather than two seconds. Three
# runs of retained passing-test directories is several gigabytes of
# nothing anybody will read.
tmp_path_retention_policy = "failed"
testpaths = [
    "apps/api/tests",
    "services/generation-worker/tests",
    "services/audio-worker/tests",
    "packages/database/tests",
    "packages/schemas/tests",
    "packages/shared/tests",
    "packages/generation-client/tests",
    "packages/audio-utils/tests",
    "packages/dataset/tests",
    "packages/training/tests",
    "packages/evaluation/tests",
    "benchmarks/music_quality/tests",
    "benchmarks/reference_audio/tests",
    "benchmarks/audio_finishing/tests",
    "packages/audio-finishing/tests",
    "packages/inference-qc/tests",
    "packages/inference-observability/tests",
    "packages/provider-resilience/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "apps/api/src",
    "services/generation-worker/src",
    "services/audio-worker/src",
    "packages/database/src",
    "packages/schemas/src",
    "packages/shared/src",
    "packages/generation-client/src",
    "packages/audio-utils/src",
    "packages/dataset/src",
    "packages/training/src",
    "packages/evaluation/src",
    "packages/inference-qc/src",
    "packages/inference-observability/src",
    "packages/provider-resilience/src",
    "packages/audio-finishing/src",
    "benchmarks/music_quality/scripts",
    "benchmarks/remix_cover/scripts",
    "benchmarks/reference_audio/scripts",
    "benchmarks/audio_finishing/scripts",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (includes E722: bare except is forbidden)
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",
    "T20",  # no stray print()
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["T20"]
# Developer CLI tools: stdout is their user interface.
"scripts/**" = ["T20"]
"services/audio-worker/src/luber_audio_worker/reference_cleanup.py" = ["T20"]
# The dataset factory CLI: stdout is its user interface, same as scripts/.
"packages/dataset/src/luber_dataset/factory/cli.py" = ["T20"]
# Operator training CLI: stdout is its user interface.
"packages/training/src/luber_training/cli.py" = ["T20"]
"packages/training/src/luber_training/remote_cli.py" = ["T20"]
# Operator evaluation CLI: stdout is its user interface.
"packages/evaluation/src/luber_evaluation/cli.py" = ["T20"]
# Inference QC dry-run CLI: stdout is its user interface. It generates
# nothing and mutates nothing; printing a report is the whole job.
"packages/inference-qc/src/luber_inference_qc/cli.py" = ["T20"]
# Observability CLI: same reason. It reads and prints; it changes no
# generation behaviour and starts nothing.
"packages/inference-observability/src/luber_inference_observability/cli.py" = ["T20"]
# Provider resilience CLI: stdout is its user interface. It reports
# circuit state and records operator decisions; it generates nothing.
"packages/provider-resilience/src/luber_provider_resilience/cli.py" = ["T20"]
# The remote worker CLI: its stdout *is* the protocol. The control plane
# parses one JSON envelope from it, so printing is the whole contract.
"packages/training/src/luber_training/remote/worker_cli.py" = ["T20"]
"benchmarks/*/scripts/*.py" = ["T20"]
# Embedded HTML/JS template: wrapping would alter the rendered page.
"benchmarks/music_quality/scripts/bench/listening.py" = ["E501"]
"**/alembic/**" = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# Strict typing applies to source; tests are exercised by pytest and
# excluded from mypy to avoid annotation ceremony.
exclude = '(^|/)tests/'
mypy_path = [
    "apps/api/src",
    "services/generation-worker/src",
    "services/audio-worker/src",
    "packages/database/src",
    "packages/schemas/src",
    "packages/shared/src",
    "packages/generation-client/src",
    "packages/audio-utils/src",
    "packages/dataset/src",
    "packages/training/src",
    "packages/evaluation/src",
    "packages/inference-qc/src",
    "packages/inference-observability/src",
    "packages/provider-resilience/src",
    "packages/audio-finishing/src",
    "benchmarks/music_quality/scripts",
    "benchmarks/remix_cover/scripts",
    "benchmarks/reference_audio/scripts",
    "benchmarks/audio_finishing/scripts",
]

[[tool.mypy.overrides]]
module = ["arq.*", "fakeredis.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# numpy 2.5 ships stubs written in Python 3.12 syntax; this project still
# targets 3.11, so skip following them rather than lowering the target.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
