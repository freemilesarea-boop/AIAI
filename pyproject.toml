[project]
name = "luber-music-ai"
version = "0.1.0"
description = "LUBER MUSIC AI monorepo — Python workspace root"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "services/generation-worker",
    "services/audio-worker",
    "packages/database",
    "packages/schemas",
    "packages/shared",
    "packages/generation-client",
    "packages/audio-utils",
    "packages/dataset",
    "packages/audio-finishing",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "fakeredis>=2.26",
    "aiosqlite>=0.20",
    "numpy>=2.1",
    # Phase 14A proves the finishing engine before integrating it, so no
    # service depends on it yet. It is installed here so its tests run
    # with the rest of the suite.
    "luber-audio-finishing",
]

[tool.uv.sources]
luber-audio-finishing = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "apps/api/tests",
    "services/generation-worker/tests",
    "services/audio-worker/tests",
    "packages/database/tests",
    "packages/schemas/tests",
    "packages/shared/tests",
    "packages/generation-client/tests",
    "packages/audio-utils/tests",
    "packages/dataset/tests",
    "benchmarks/music_quality/tests",
    "benchmarks/reference_audio/tests",
    "benchmarks/audio_finishing/tests",
    "packages/audio-finishing/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "apps/api/src",
    "services/generation-worker/src",
    "services/audio-worker/src",
    "packages/database/src",
    "packages/schemas/src",
    "packages/shared/src",
    "packages/generation-client/src",
    "packages/audio-utils/src",
    "packages/dataset/src",
    "packages/audio-finishing/src",
    "benchmarks/music_quality/scripts",
    "benchmarks/remix_cover/scripts",
    "benchmarks/reference_audio/scripts",
    "benchmarks/audio_finishing/scripts",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (includes E722: bare except is forbidden)
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",
    "T20",  # no stray print()
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["T20"]
# Developer CLI tools: stdout is their user interface.
"scripts/**" = ["T20"]
"benchmarks/*/scripts/*.py" = ["T20"]
# Embedded HTML/JS template: wrapping would alter the rendered page.
"benchmarks/music_quality/scripts/bench/listening.py" = ["E501"]
"**/alembic/**" = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# Strict typing applies to source; tests are exercised by pytest and
# excluded from mypy to avoid annotation ceremony.
exclude = '(^|/)tests/'
mypy_path = [
    "apps/api/src",
    "services/generation-worker/src",
    "services/audio-worker/src",
    "packages/database/src",
    "packages/schemas/src",
    "packages/shared/src",
    "packages/generation-client/src",
    "packages/audio-utils/src",
    "packages/dataset/src",
    "packages/audio-finishing/src",
    "benchmarks/music_quality/scripts",
    "benchmarks/remix_cover/scripts",
    "benchmarks/reference_audio/scripts",
    "benchmarks/audio_finishing/scripts",
]

[[tool.mypy.overrides]]
module = ["arq.*", "fakeredis.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# numpy 2.5 ships stubs written in Python 3.12 syntax; this project still
# targets 3.11, so skip following them rather than lowering the target.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
