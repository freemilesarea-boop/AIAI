[project]
name = "luber-generation-worker"
version = "0.1.0"
description = "GPU generation worker skeleton (ARQ). Real provider execution arrives in Phase 2."
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26",
    "luber-shared",
    "luber-schemas",
    "luber-generation-client",
    "luber-database",
    "luber-audio-utils",
]

[tool.uv.sources]
luber-shared = { workspace = true }
luber-schemas = { workspace = true }
luber-generation-client = { workspace = true }
luber-database = { workspace = true }
luber-audio-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_generation_worker"]
