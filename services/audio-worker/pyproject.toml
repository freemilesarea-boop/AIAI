[project]
name = "luber-audio-worker"
version = "0.1.0"
description = "Audio post-processing worker skeleton (ARQ). Real pipeline arrives in Phase 4."
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26",
    "luber-shared",
    "luber-schemas",
    "luber-audio-utils",
]

[tool.uv.sources]
luber-shared = { workspace = true }
luber-schemas = { workspace = true }
luber-audio-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luber_audio_worker"]
